<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Qualifying event decision tool</title>
  <style>
    html, body { margin: 0; padding: 0; background: #F5F7FB; height: auto; }
    iframe { border: 0; width: 100%; height: 960px; display: block; }
  </style>
</head>
<body>
  <iframe id="tool" title="Qualifying event decision tool" src="https://dankirves-prog.github.io/dkbenefits-tools/qualifying-event/index.html"></iframe>
  <script>
    var ALLOWED = [
      'https://www.dkbenefits.net',
      'https://dkbenefits.net',
      'https://dankirves-prog.github.io',
      'https://www-dkbenefits-net.filesusr.com',
      'https://editor.wix.com',
      'https://create.editorx.com',
      'https://manage.wix.com'
    ];
    var frame = document.getElementById('tool');
    function forward(target, data) {
      ALLOWED.forEach(function (origin) {
        try { target.postMessage(data, origin); } catch (err) {}
      });
      if (window.location.origin && ALLOWED.indexOf(window.location.origin) === -1) {
        try { target.postMessage(data, window.location.origin); } catch (err) {}
      }
    }
    function applyHeight(height) {
      var next = Math.max(320, Math.ceil(height));
      frame.style.height = next + 'px';
      document.documentElement.style.height = next + 'px';
      document.body.style.height = next + 'px';
    }
    window.addEventListener('message', function (event) {
      var known = ALLOWED.indexOf(event.origin) !== -1 || event.origin === window.location.origin;
      if (!known) return;
      var data = event.data || {};
      if (event.source === frame.contentWindow) {
        if (data.type === 'resize' && data.tool === 'qualifying-event' && typeof data.height === 'number') {
          applyHeight(data.height);
        }
        if (data.type === 'scrollTop') window.scrollTo(0, 0);
        forward(window.parent, data);
      } else if (frame.contentWindow) {
        frame.contentWindow.postMessage(data, 'https://dankirves-prog.github.io');
      }
    });
  </script>
</body>
</html>
