<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; }
    iframe { border: 0; width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <iframe id="tool" title="Qualifying event decision tool" src="https://dankirves-prog.github.io/dkbenefits-tools/qualifying-event/index.html"></iframe>
  <script>
    var ALLOWED = [
      'https://www.dkbenefits.net',
      'https://dkbenefits.net',
      'https://dankirves-prog.github.io',
      'https://www-dkbenefits-net.filesusr.com',
      'https://editor.wix.com',
      'https://create.editorx.com',
      'https://manage.wix.com'
    ];
    var frame = document.getElementById('tool');
    function forward(target, data) {
      ALLOWED.forEach(function (origin) {
        try { target.postMessage(data, origin); } catch (err) {}
      });
    }
    window.addEventListener('message', function (event) {
      if (ALLOWED.indexOf(event.origin) === -1) return;
      if (event.source === frame.contentWindow) forward(window.parent, event.data);
      else if (frame.contentWindow) frame.contentWindow.postMessage(event.data, 'https://dankirves-prog.github.io');
    });
  </script>
</body>
</html>
